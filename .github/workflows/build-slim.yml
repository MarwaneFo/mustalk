name: Build & push image Serverless allegee

# Variante degraissee de l'image cu124 : base runtime au lieu de devel,
# et sans tensorflow. Meme torch 2.4.1 / CUDA 12.4.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.slim
      - handler.py
      - download_weights.sh
      - .github/workflows/build-slim.yml

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Liberer de l'espace disque
        run: |
          echo "Avant :"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get purge -y '^llvm-.*' '^mongodb-.*' '^mysql-.*' azure-cli \
                                google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo docker image prune --all --force
          echo "Apres :"; df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom de l'image en minuscules
        id: img
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "out=${REGISTRY}/${owner}/musetalk-serverless" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.slim
          push: true
          tags: ${{ steps.img.outputs.out }}:slim
          provenance: false

      - name: Taille de l'image publiee
        run: |
          docker manifest inspect "${{ steps.img.outputs.out }}:slim" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('TAILLE COMPRESSEE : %.2f Go' % (sum(l['size'] for l in d['layers'])/1024**3))" \
            | tee -a "$GITHUB_STEP_SUMMARY"
