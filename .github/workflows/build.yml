name: Build & push MuseTalk image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      download_weights:
        description: "Intégrer les poids dans l'image (~20 Go) ou non (~9 Go)"
        type: choice
        options: ["true", "false"]
        default: "true"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: musetalk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Le runner n'a que ~25 Go libres : on récupère ~30 Go de plus.
      - name: Libérer de l'espace disque
        run: |
          echo "Avant :"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get purge -y '^llvm-.*' '^mongodb-.*' '^mysql-.*' azure-cli \
                                google-chrome-stable firefox powershell || true
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo docker image prune --all --force
          echo "Après :"; df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom de l'image en minuscules
        id: img
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            DOWNLOAD_WEIGHTS=${{ inputs.download_weights || 'true' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:v1.5
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          provenance: false

      - name: Récapitulatif
        run: |
          {
            echo "## Image publiée"
            echo '```'
            echo "${{ steps.img.outputs.name }}:latest"
            echo "${{ steps.img.outputs.name }}:v1.5"
            echo '```'
            echo "À utiliser comme *Container Image* dans un template RunPod."
          } >> "$GITHUB_STEP_SUMMARY"
