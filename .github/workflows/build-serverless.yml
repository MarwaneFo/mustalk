name: Build & push image Serverless

# Construit la variante Serverless PAR-DESSUS l'image de base.
# À lancer une fois que "Build & push MuseTalk image" a terminé.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - handler.py
      - Dockerfile.serverless
      - .github/workflows/build-serverless.yml

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Noms d'images en minuscules
        id: img
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "base=${REGISTRY}/${owner}/musetalk:v1.5"            >> "$GITHUB_OUTPUT"
          echo "out=${REGISTRY}/${owner}/musetalk-serverless"       >> "$GITHUB_OUTPUT"

      - name: L'image de base existe-t-elle ?
        run: |
          docker manifest inspect "${{ steps.img.outputs.base }}" > /dev/null || {
            echo "::error::Image de base introuvable : ${{ steps.img.outputs.base }}"
            echo "Lance d'abord le workflow 'Build & push MuseTalk image'."
            exit 1
          }

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.serverless
          push: true
          build-args: |
            BASE=${{ steps.img.outputs.base }}
          tags: |
            ${{ steps.img.outputs.out }}:latest
            ${{ steps.img.outputs.out }}:v1.5
          provenance: false

      - name: Récapitulatif
        run: |
          {
            echo "## Image Serverless publiée"
            echo '```'
            echo "${{ steps.img.outputs.out }}:v1.5"
            echo '```'
            echo "Endpoint à créer dans la **même région que le volume réseau** (us-nc-1),"
            echo "avec le volume attaché : les avatars sont lus sur \`/runpod-volume\`."
          } >> "$GITHUB_STEP_SUMMARY"
