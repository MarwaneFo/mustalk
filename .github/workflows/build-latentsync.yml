name: Build & push LatentSync

# Second modele de synchronisation labiale, publie a cote de MuseTalk et non
# a sa place : les deux endpoints coexistent, on compare, on decide ensuite.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.latentsync
      - handler_latentsync.py
      - avatar/Inna.mp4
      - .github/workflows/build-latentsync.yml

env:
  REGISTRY: ghcr.io
  IMAGE: latentsync-serverless

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # pour publier le journal en cas d'echec
      packages: write

    steps:
      - uses: actions/checkout@v4

      # L'image finale pese 18 a 20 Go decompressee, et le cache de
      # construction s'y ajoute. Le menage par defaut du runner ne suffit
      # pas : on retire tout ce qui ne sert pas a construire une image.
      - name: Liberer de l'espace disque
        run: |
          echo "Avant :"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/share/swift \
                      /usr/local/lib/node_modules /opt/az /usr/local/julia* \
                      /usr/share/miniconda "$AGENT_TOOLSDIRECTORY"
          sudo apt-get purge -y '^llvm-.*' '^php.*' '^mysql-.*' '^dotnet-.*' \
                                '^google-cloud-.*' firefox google-chrome-stable \
                                azure-cli || true
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo docker image prune -af || true
          echo "Apres :"; df -h /

      - name: Espace restant avant construction
        run: df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Noms d'images
        id: img
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "out=${REGISTRY}/${owner}/${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ts=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      # Construction appelee directement plutot que via l'action : c'est le
      # seul moyen de capturer la sortie et de la republier si ca casse.
      - name: Build & push
        run: |
          set -o pipefail
          docker buildx build \
            --file Dockerfile.latentsync \
            --tag ${{ steps.img.outputs.out }}:latest \
            --tag ${{ steps.img.outputs.out }}:${{ steps.img.outputs.ts }} \
            --provenance=false --push --progress plain . 2>&1 | tee /tmp/build.log

      # L'API GitHub refuse les journaux d'Actions sans jeton. On publie donc
      # la fin du journal dans une branche dediee, que le depot etant public
      # une simple URL brute suffit a lire. Branche orpheline et forcee : elle
      # ne contient qu'un fichier, sans historique, et ne touche pas a main.
      - name: Publier le journal en cas d'echec
        if: failure()
        run: |
          mkdir -p /tmp/journal
          tail -c 60000 /tmp/build.log > /tmp/journal/latentsync.log || \
            echo "aucune sortie capturee" > /tmp/journal/latentsync.log
          cd /tmp/journal
          git init -q
          git checkout -q -b build-logs
          git config user.email "actions@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add latentsync.log
          git commit -q -m "journal du build ${{ github.sha }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            build-logs
          echo "journal publie sur la branche build-logs"

      - name: Recapitulatif
        run: |
          {
            echo "## Image LatentSync publiee"
            echo '```'
            echo "${{ steps.img.outputs.out }}:${{ steps.img.outputs.ts }}"
            echo "${{ steps.img.outputs.out }}:latest"
            echo '```'
            echo "### Endpoint a creer"
            echo "- Nom : \`latentsync-video\`"
            echo "- GPU : **Ampere, Ada ou Hopper** — A5000, L40S, 4090, A100."
            echo "  **Jamais Blackwell** (lignes \`PRO\`) : torch 2.5.1 n'a pas de"
            echo "  noyaux compiles pour cette architecture."
            echo "- VRAM : ~18 Go en 512 px. Les 24 Go d'une A5000 suffisent."
            echo "- Execution Timeout : **1200 s**. La diffusion est plus lente"
            echo "  que MuseTalk, et le plafond RunPod compte la file d'attente."
            echo ""
            echo "### Licence"
            echo "Apache 2.0 — usage commercial autorise, contrairement aux poids XTTS."
          } >> "$GITHUB_STEP_SUMMARY"
