name: Build & push image autonome allegee

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.standalone
      - .github/workflows/build-standalone-slim.yml
      - handler.py
      - avatar/**
      - .dockerignore
      
env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Liberer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean && df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Noms d'images
        id: img
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "base=${REGISTRY}/${owner}/musetalk-serverless:slim" >> "$GITHUB_OUTPUT"
          echo "out=${REGISTRY}/${owner}/musetalk-serverless"        >> "$GITHUB_OUTPUT"

      - name: L'image de base existe-t-elle ?
        run: |
          docker manifest inspect "${{ steps.img.outputs.base }}" > /dev/null || {
            echo "::error::Image de base introuvable : ${{ steps.img.outputs.base }}"
            exit 1
          }

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.standalone
          push: true
          build-args: BASE=${{ steps.img.outputs.base }}
          tags: ${{ steps.img.outputs.out }}:standalone-slim-slim
          provenance: false

      - name: Recapitulatif
        run: |
          {
            echo "## Image autonome publiee"
            echo '```'
            echo "${{ steps.img.outputs.out }}:standalone-slim"
            echo '```'
            echo "Avatar Inna embarque. **Aucun network volume requis** :"
            echo "l'endpoint peut tourner dans n'importe quel data center."
            echo ""
            echo "Ne pas autoriser les GPU Blackwell (PRO 6000) : torch 2.4.1"
            echo "n'a pas de noyaux compiles pour cette architecture."
          } >> "$GITHUB_STEP_SUMMARY"
